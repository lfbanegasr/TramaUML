# Usar desde el paquete aislado: la raíz debe contener core/ y despliegue/.
services:
  - type: web
    name: trama-uml
    runtime: docker
    plan: free
    region: virginia
    dockerfilePath: ./despliegue/2026-11-11_render.Dockerfile
    dockerContext: .
    healthCheckPath: /salud
    autoDeployTrigger: commit
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: despliegue
      - key: UML_DB_URL
        sync: false
      - key: UML_DB_USER
        value: uml_app
      - key: UML_DB_PASSWORD
        sync: false
      - key: UML_IA_CLAVE
        sync: false
      - key: UML_IA_CONTEXTO_REMOTO
        value: "true"
      - key: UML_IA_MODELO_TEXTO
        value: gemini-3.8-flash
      - key: UML_IA_MODELO_VISION
        value: gemini-3.8-flash
      - key: UML_IA_MODELO_TRANSCRIPCION
        value: gemini-2.5-flash
      - key: UML_SERVICIOS_MASTER_KEY
        generateValue: true
