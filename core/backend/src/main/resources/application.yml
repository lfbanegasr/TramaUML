spring:
  application:
    name: plataforma-uml
  datasource:
    url: ${UML_DB_URL:jdbc:postgresql://localhost:55432/uml_collab?currentSchema=uml_colaborativo,public}
    username: ${UML_DB_USER:uml_app}
    password: ${UML_DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 5000
      connection-init-sql: "SET statement_timeout = '15s'"
  sql:
    init:
      mode: never
  jackson:
    deserialization:
      fail-on-unknown-properties: true
server:
  address: ${UML_BIND_ADDRESS:127.0.0.1}
  port: ${UML_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
uml:
  compilacion:
    maven-home: ${UML_COMPILACION_MAVEN_HOME:}
    repositorio: ${UML_COMPILACION_REPOSITORIO:}
    directorio: ${UML_COMPILACION_DIRECTORIO:}
    segundos: ${UML_COMPILACION_SEGUNDOS:90}
    worker: ${UML_COMPILACION_WORKER:true}
  cookie-secure: ${UML_COOKIE_SECURE:true}
  servicios:
    clave-maestra: ${UML_SERVICIOS_MASTER_KEY:}
    version-clave: ${UML_SERVICIOS_KEY_VERSION:v1}
  ia:
    contexto-remoto: ${UML_IA_CONTEXTO_REMOTO:true}
    worker: ${UML_IA_WORKER:true}
    proveedor: GEMINI
    clave: ${UML_IA_CLAVE:}
    url-texto: ${UML_IA_URL_TEXTO:}
    url-vision: ${UML_IA_URL_VISION:}
    url-transcripcion: ${UML_IA_URL_TRANSCRIPCION:}
    modelo-texto: ${UML_IA_MODELO_TEXTO:gemini-3.1-flash-lite}
    modelo-vision: ${UML_IA_MODELO_VISION:gemini-3.1-flash-lite}
    modelo-transcripcion: ${UML_IA_MODELO_TRANSCRIPCION:gemini-3.1-flash-lite}
  bootstrap:
    enabled: ${UML_BOOTSTRAP_ENABLED:false}
    nombre-usuario: ${UML_ADMIN_USERNAME:}
    correo: ${UML_ADMIN_EMAIL:}
    nombre-completo: ${UML_ADMIN_NAME:}
    contrasena: ${UML_ADMIN_PASSWORD:}
