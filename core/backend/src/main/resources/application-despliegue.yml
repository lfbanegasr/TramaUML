# Perfil para Render: frontend compilado y API en el mismo origen HTTPS.
server:
  address: 0.0.0.0
  port: ${PORT:8080}
  forward-headers-strategy: framework
  tomcat:
    threads:
      max: 30
      min-spare: 2
spring:
  datasource:
    hikari:
      maximum-pool-size: 5
      minimum-idle: 0
      connection-timeout: 20000
      idle-timeout: 60000
      max-lifetime: 300000
uml:
  cookie-secure: true
